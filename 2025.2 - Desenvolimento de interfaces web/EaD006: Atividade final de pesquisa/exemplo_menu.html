<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Menu Responsivo com Alpine.js</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    .menu-container { position: relative; }
    .menu-button { 
      padding: 8px 16px; 
      cursor: pointer; 
      background-color: #3490dc; 
      color: white; 
      border: none; 
      border-radius: 4px; 
      font-size: 16px;
    }
    .menu-list {
      position: absolute;
      background: white;
      border: 1px solid #ccc;
      margin-top: 4px;
      padding: 0;
      list-style: none;
      width: 150px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      z-index: 10;
    }
    .menu-item {
      padding: 8px 12px;
      display: block;
      text-decoration: none;
      color: black;
    }
    .menu-item:hover {
      background-color: #eee;
    }
  </style>
</head>
<body>
  <div x-data="{ open: false }" class="menu-container">
    <button @click="open = !open" class="menu-button">
      Menu
    </button>
    <ul x-show="open" @click.away="open = false" class="menu-list" style="display:none;">
      <li><a href="#home" class="menu-item">Home</a></li>
      <li><a href="#about" class="menu-item">Sobre</a></li>
      <li><a href="#services" class="menu-item">Serviços</a></li>
      <li><a href="#contact" class="menu-item">Contato</a></li>
    </ul>
  </div>
</body>
</html>
